[project]
name = "alphasieve"
version = "0.0.1"
description = "Agent-driven low-frequency quant research with layered verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
]

[project.scripts]
alphasieve = "alphasieve.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphasieve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
