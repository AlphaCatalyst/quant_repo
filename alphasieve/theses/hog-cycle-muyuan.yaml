revisions:
  - date: 2026-09-16
    note: 报告未给仓位上限；研究状态暂设零仓位。
  - date: 2026-09-27
    note: 原报告把上行成本区间修订为 12.0–13.5 元/kg；该映射仍未由公司指引证实。
  - date: 2026-10-04
    note: 依据 theses/reviews/hog-cycle-muyuan-2026-10-04-codex.md 与 theses/reviews/hog-cycle-muyuan-2026-10-04-claude.md 修订；将基准统一为 2027E、2025 均重调至 126 kg、用 2025 年报归母/合并净利比替换 0.925，另列未经验证的净影响残差，更新 2026-09-30 不复权收盘、可结算预测及对应证伪条件。仍为 researching。
