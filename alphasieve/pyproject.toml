[project]
name = "alphasieve"
version = "0.0.1"
description = "Agent-driven low-frequency quant research with layered verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "baostock>=0.9.4",
    "fastapi>=0.141.1",
    "numba>=0.67.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.7",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
tracking = ["wandb>=0.19"]

[project.scripts]
alphasieve = "alphasieve.cli.main:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.0",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphasieve"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
