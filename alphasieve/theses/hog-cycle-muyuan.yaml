thesis_id: hog-cycle-muyuan
title: 牧原股份猪周期估值推演复核
assets:
  - {code: 002714.SZ, name: 牧原股份}
status: researching
as_of: 2026-10-04
core_variables: [hog_price, full_cost, slaughter_volume, average_weight, other_business_after_expenses, attributable_factor, pe]
argument:
  - 基准是 2027E 全年情景；2027 猪价、成本和出栏量均为待验证的预测假设，2026 出栏指引仅作数量级参照。
  - 能繁母猪存栏与供需变化须持续观察农业农村部统计；不同猪价序列不可混用。
  - 头均价差乘出栏量只是养殖利润近似值；其他业务、期间费用、税费等净影响另列残差，再按年报归母比例折算。完全成本口径可能已含部分期间费用，不机械重复扣除。
  - 2026-09-30 BaoStock 不复权收盘 42.45 元，按以下条件模型反推市场隐含猪价；模型并非独立盈利预测或目标价。
parameters:
  hog_price:
    base: 14.0
    unit: 元/kg
    low: 13.0
    high: 18.0
    evidence: [gf_price, original_price, price_range]
  full_cost:
    base: 11.2
    unit: 元/kg
    low: 10.5
    high: 12.0
    evidence: [gf_cost, cost_actual_2025, cost_h1_2026, cost_range]
  slaughter_volume:
