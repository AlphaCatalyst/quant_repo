status: researching
as_of: 2026-09-14
core_variables: [hog_price, full_cost, slaughter_volume, average_weight, attributable_factor, pe]
argument:
  - 周期观：能繁母猪去化影响后续猪价，跨期猪价须锁定同一口径。
  - 参数层：猪价、完全成本、出栏量和均重均需逐项核对出处。
  - 估值层：头均利润乘出栏量、归母折算及 PE，再除以股本。
