falsifiers:
  - id: price_below_market_implied
    condition: 2027 年可比较的全国生猪均价持续低于按 2026-09-30 股价和当前基准参数反推的猪价约 13.75 元/kg（旧版 2026-09-14 的 42.59 元与旧参数对应约 14.04 元/kg）；核对农业农村部 https://www.moa.gov.cn/ztzl/szcpxx/ 价格统计及大商所 https://www.dce.com.cn/ LH 期货曲线，不把期货价直接等同现货。
    variable: hog_price
    action: 撤销基准价差所支撑的现价估值并重算利润与股价。
  - id: company_cost_above_base
    condition: 牧原月度销售简报 https://www.cninfo.com.cn/new/disclosure/stock?stockCode=002714 或定期报告所披露完全成本持续高于基准 11.2 元/kg；若达 12.0 元/kg，在其余参数不变时重算市场隐含猪价。
    variable: full_cost
    action: 撤销 11.2 元/kg 成本假设；若月报未披露成本则等待定期报告，不自行推算成已披露值。
  - id: volume_or_weight_shortfall
    condition: 牧原月度销售简报 https://www.cninfo.com.cn/new/disclosure/stock?stockCode=002714 的商品猪销量与售价趋势、定期报告披露的年度出栏量或均重，与 2027E 7800 万头及 126 kg 假设明显背离。
    variable: slaughter_volume, average_weight
    action: 按公司披露口径重估，分别核对月度销量和年度均重。
position_limit: 0.0
