evidence:
  - id: gf_price
    claim: 2027E 猪价 14.0 元/kg；所谓广发预测尚无可核实的研报标题、日期和原文，因此这里只作未验证情景假设。
    value: 14.0
    source: https://alphacatalyst.github.io/AlphaNotes/reports/hog-cycle/analysis.html §2、§8；二手转述，未检出广发原研报
    grade: C
    accessed: 2026-10-04
  - id: gf_cost
    claim: 2027E 完全成本 11.2 元/kg；所谓广发预测尚无可核实原研报，仅作未验证情景假设。
    value: 11.2
    source: https://alphacatalyst.github.io/AlphaNotes/reports/hog-cycle/analysis.html §8；二手转述
    grade: C
    accessed: 2026-10-04
  - id: original_price
    claim: 原推演上行猪价假设 18 元/kg，不代表公司或交易所预测。
    value: 18.0
    source: https://alphacatalyst.github.io/AlphaNotes/reports/hog-cycle/analysis.html §1、§2
    grade: C
    accessed: 2026-10-04
  - id: price_range
    claim: 13–18 元/kg 为猪价情景压力区间，不是已验证概率区间；13 引自报告谨慎情景。
    source: https://alphacatalyst.github.io/AlphaNotes/reports/hog-cycle/analysis.html §8、§10
    grade: C
    accessed: 2026-10-04
  - id: cost_actual_2025
    claim: 2025 年生猪养殖完全成本约 12 元/kg，年报第 14 页。
    value: 12.0
    source: https://static.cninfo.com.cn/finalpage/2026-03-28/1225042507.PDF
    grade: A
    accessed: 2026-10-04
  - id: cost_h1_2026
    claim: 2026 年 6 月完全成本约 11.7 元/kg，全年平均目标 11.5 元/kg；半年报第 11 页。目标是管理层展望。
    source: https://static.cninfo.com.cn/finalpage/2026-08-21/1225485220.PDF
    grade: B
    accessed: 2026-10-04
  - id: cost_range
    claim: 2027E 成本 10.5–12.0 元/kg 为基准两侧压力区间；10.5 无公司指引，12.0 是 2025 实绩而非 2027 预测。
    source: https://static.cninfo.com.cn/finalpage/2026-03-28/1225042507.PDF 第14页；https://alphacatalyst.github.io/AlphaNotes/reports/hog-cycle/analysis.html §4、§8；研究者情景设定
    grade: C
    accessed: 2026-10-04
  - id: guide
    claim: 公司在 2026 年业绩说明会预计当年销售商品猪 7500–8100 万头；管理层口头指引，不是 2027 指引。
    source: https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?CompanyCode=80198868&gather=1&id=12097210
    grade: B
    accessed: 2026-10-04
  - id: volume_2025
    claim: 2025 年销售商品猪 7798.1 万头，年报第 14 页。
    value: 0.77981
    source: https://static.cninfo.com.cn/finalpage/2026-03-28/1225042507.PDF
    grade: A
    accessed: 2026-10-04
  - id: volume_2027_assumption
    claim: 2027E 基准 7800 万头、区间 7000–8600 万头均为研究者外推；基准靠近 2025 实绩与 2026 管理层指引中点，尚无 2027 公司指引。
    value: 0.78
    source: https://static.cninfo.com.cn/finalpage/2026-03-28/1225042507.PDF 第14页；https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?CompanyCode=80198868&gather=1&id=12097210；研究者情景设定
    grade: C
    accessed: 2026-10-04
  - id: missing_volume_statement
    claim: 未检出公司对原文所述极高出栏量的正式指引；该数字只保留为上行情景假设。
    source: https://static.cninfo.com.cn/finalpage/2026-08-21/1225485220.PDF；https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?CompanyCode=80198868&gather=1&id=12097210；检索年报、半年报及业绩说明会
    grade: D
    accessed: 2026-10-04
  - id: weight_2025
    claim: 公司回答 2025 年商品猪销售均重约 126 kg；业绩说明会问答第 5 项，是管理层表述。
    value: 126.0
    source: https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?CompanyCode=80198868&gather=1&id=12097210
    grade: B
    accessed: 2026-10-04
  - id: weight_range
    claim: 2027E 均重 120–132 kg 为以 2025 年约 126 kg 为中心的对称 ±6 kg 压力设定，非公司预测。
    source: https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?CompanyCode=80198868&gather=1&id=12097210；研究者情景设定
    grade: C
    accessed: 2026-10-04
  - id: annual_pnl
    claim: 2025 合并利润表第 115–116 页：销售、管理、研发、财务费用合计 93.2300 亿元，所得税费用 -0.0188 亿元；屠宰肉食收入 452.28 亿元且首次全年盈利。报告不单列可直接外推的 2027 养殖价差至归母净利桥。
    source: https://static.cninfo.com.cn/finalpage/2026-03-28/1225042507.PDF 第14、115–116、203–204页
    grade: A
    accessed: 2026-10-04
  - id: bridge_residual
    claim: 其他业务、期间费用、税费及价差口径差异合并为 2027E 净影响残差，基准暂设 0 亿元、压力 ±30 亿元；无可核验 2027 预测。因完全成本口径不明，不把 2025 期间费用再机械扣一次。
    value: 0.0
    source: https://static.cninfo.com.cn/finalpage/2026-03-28/1225042507.PDF 第14、115–116页；研究者情景设定
    grade: C
    accessed: 2026-10-04
  - id: attributable_2025
    claim: 2025 年合并净利润 158.1181754345 亿元、归母净利润 154.8689125404 亿元、少数股东损益 3.2492628941 亿元；归母比例 = 154.8689125404 / 158.1181754345 = 0.979450415。只验证净利到归母这一段，并非 2027 保证比例。
    value: 0.979450415
    source: https://static.cninfo.com.cn/finalpage/2026-03-28/1225042507.PDF 第115–116页合并利润表
    grade: A
    accessed: 2026-10-04
  - id: attribution_range
    claim: 0.95–1.00 是围绕 2025 年归母比例的研究者压力区间；少数股东损益可能变化。
    source: https://static.cninfo.com.cn/finalpage/2026-03-28/1225042507.PDF 第116页；研究者情景设定
    grade: C
    accessed: 2026-10-04
  - id: original_pe
    claim: 原推演使用 10 倍 PE，仅是估值假设。
    value: 10.0
    source: https://alphacatalyst.github.io/AlphaNotes/reports/hog-cycle/analysis.html §1、§8
    grade: C
    accessed: 2026-10-04
  - id: pe_range
    claim: 8–12 倍 PE 是围绕 10 倍的对称 ±2 倍敏感性，不是市场可证的合理估值带。
    source: https://alphacatalyst.github.io/AlphaNotes/reports/hog-cycle/analysis.html §8；研究者情景设定
    grade: C
    accessed: 2026-10-04
  - id: shares
    claim: 2026-06-30 总股本 5,772,996,075 股，即 57.72996075 亿股；半年报股本表。后续发行、回购需另行检查。
    value: 57.72996075
    source: https://static.cninfo.com.cn/finalpage/2026-08-21/1225485220.PDF 股本表
    grade: A
    accessed: 2026-10-04
  - id: market
    claim: 002714.SZ 于 2026-09-30 不复权收盘 42.45 元；本地调用 BaoStockSession.daily，adjustflag=3。不属交易所一手数据。
    value: 42.45
    source: https://www.baostock.com/baostock/index.php/%E9%A6%96%E9%A1%B5 ; BaoStock query_history_k_data_plus(sz.002714, 2026-09-30, adjustflag=3)
    grade: C
    accessed: 2026-10-04
  - id: sow_data
    claim: 能繁母猪存栏为猪周期论点的待观察变量，须记录农业农村部原统计发布时间与口径；本版未把其数值代入估值。
    source: https://www.moa.gov.cn/ztzl/szcpxx/
    grade: A
    accessed: 2026-10-04
valuation:
  formula: ((hog_price - full_cost) * average_weight * slaughter_volume + other_business_after_expenses) * attributable_factor * pe / shares
  output_unit: 元/股
  price_param: hog_price
  market_price: 42.45
  shares: 57.72996075
