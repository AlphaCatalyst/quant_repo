campaign_id: fundamental-20d-002
title: 财务质量与成长 × 量价（20 日、3 lane；GPT-6 Sol 高端 + DeepSeek V4 Pro 低端）
question: >
  Do point-in-time profitability and growth signals, on their own, relative to industry peers, or conditioned on
  price and turnover behaviour, carry information about 20-day CSI 800 returns beyond the seed library?
universe: csi800
domains: [profitability, growth, price, turnover_liquidity, size_value]
cells:
  - {domain: profitability, form: level, scale: quarterly}
  - {domain: profitability, form: change_momentum, scale: medium}
  - {domain: profitability, form: group_relative, scale: quarterly}
  - {domain: profitability, form: conditional_interaction, scale: medium}
  - {domain: growth, form: level, scale: quarterly}
  - {domain: growth, form: change_momentum, scale: medium}
  - {domain: growth, form: group_relative, scale: quarterly}
  - {domain: growth, form: conditional_interaction, scale: medium}
lanes: 3
budgets: {trials: 300, turns: 90, turn_minutes: 30, max_hours: 72, holdout_reads: 2}
stop: {no_improvement_turns: 30, max_consecutive_failed_turns: 6}
agents:
  - {harness: codex, model: gpt-6-sol, effort: high}
  - {harness: claude, model: deepseek-v4-pro}
  - {harness: claude, model: deepseek-v4-pro}
